<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 20 – Pako</title>
</head>
<body>

<h2>Obliczanie długości boków trójkąta</h2>

<p>Punkt A: x=<input type="number" id="xa_pako"> 
            y=<input type="number" id="ya_pako"></p>
<p>Punkt B: x=<input type="number" id="xb_pako"> 
            y=<input type="number" id="yb_pako"></p>
<p>Punkt C: x=<input type="number" id="xc_pako"> 
            y=<input type="number" id="yc_pako"></p>

<button onclick="AB_kry()">Oblicz AB</button>
<button onclick="BC_kry()">Oblicz BC</button>
<button onclick="AC_kry()">Oblicz AC</button>

<div id="wynik"></div>

<script>
function AB_kry() {
    var xa = parseFloat(document.getElementById("xa_pako").value);
    var ya = parseFloat(document.getElementById("ya_pako").value);
    var xb = parseFloat(document.getElementById("xb_pako").value);
    var yb = parseFloat(document.getElementById("yb_pako").value);
    var ab = Math.sqrt(Math.pow(xb - xa, 2) + Math.pow(yb - ya, 2));
    document.getElementById("wynik").innerHTML = "Długość AB = " + ab.toFixed(2);
}

function BC_kry() {
    var xb = parseFloat(document.getElementById("xb_pako").value);
    var yb = parseFloat(document.getElementById("yb_pako").value);
    var xc = parseFloat(document.getElementById("xc_pako").value);
    var yc = parseFloat(document.getElementById("yc_pako").value);
    var bc = Math.sqrt(Math.pow(xc - xb, 2) + Math.pow(yc - yb, 2));
    document.getElementById("wynik").innerHTML = "Długość BC = " + bc.toFixed(2);
}

function AC_kry() {
    var xa = parseFloat(document.getElementById("xa_pako").value);
    var ya = parseFloat(document.getElementById("ya_pako").value);
    var xc = parseFloat(document.getElementById("xc_pako").value);
    var yc = parseFloat(document.getElementById("yc_pako").value);
    var ac = Math.sqrt(Math.pow(xc - xa, 2) + Math.pow(yc - ya, 2));
    document.getElementById("wynik").innerHTML = "Długość AC = " + ac.toFixed(2);
}
</script>

</body>
</html>
