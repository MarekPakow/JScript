<!DOCTYPE html> 
<html lang="pl"> 
<head>  
   <meta charset="utf-8"> 
    <title>  Przykład użycia pętli </title> 
  <script language="JavaScript"> 
var ile=prompt("ile razy powtórzyć=",""); 
var inicjal=prompt("Podaj twoje inicjały=",""); 
   for ( var i=1; i<=ile; i++) 
    { 
      for ( var k=1; k<=i; k++) 
        { 
           document.write("&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp");     
         }
         document.write(i+"_"+inicjal+"_"+i+"<br>"); 
     } 
  </script> 
</head>  
<body>  
</body>  
</html>
