<!DOCTYPE html>   
<head>    
<title>Obliczanie sumy szeregu harmonicznego </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
var suma_pak = 0

for(i_pak=1;i_pak<=1000000;i_pak++)
{
suma_pak+=1/i_pak;
} 

document.write("suma="+suma_pak.toFixed(2)+"<br>");


</script> 
</div> 
</body> 
</html>
