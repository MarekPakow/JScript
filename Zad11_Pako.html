<!DOCTYPE html>   
<head>    
<title> proste obliczenia</title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:green;font-size:50px;"> 
<script language="JavaScript"> 
  // Marek Pakowski   11.09.2025 
// Zadanie 11  
var liczba1_Pak=prompt("Podaj liczbe D1 (Liczba D1 musi być większa niż D2)",""); 
var liczba2_Pak=prompt("Podaj liczbe D2",""); 
var suma; 
var a=parseFloat(liczba1_Pak); 
var b=parseFloat(liczba2_Pak); 
suma=(a*86400)-(b*86400); 
document.write("Mineło " +suma+ " sekund<br>");  
</script> 
</div> 
</body> 

</html>
