<!DOCTYPE html>   
<head>    
<title>Sprawdzenie wczytanych danych </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
do { 
var liczba1=prompt("wysokość=",""); 
var h_pak=parseFloat(liczba1); 
} 
while ( h_pak<=0); 
do { 
var liczba1=prompt("podstawę=",""); 
var a_pak=parseFloat(liczba1); 
} 
while(!( a_pak>0)); 
var Pole_pak=a_pak*h_pak/2; 
document.write("Pole="+Pole_pak.toFixed(2)+" cm^2"+"<br>"); 
</script> 
</div> 
</body> 
</html>
